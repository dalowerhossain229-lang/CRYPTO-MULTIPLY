<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRYPTO MULTIPLY - FAST TRADING GRAPH</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 🎨 স্পীড অপ্টিমাইজড কোর সিএসএস ফ্রেম ইনজেকশন ভাই ভাই */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #05070c; font-family: 'Segoe UI', Roboto, sans-serif; color: #fff; -webkit-tap-highlight-color: transparent; user-select: none; }
        .header { display: none !important; } /* ডাবল ব্যালেন্স বক্স জ্যাম ব্লকার */
        
        body { 
            background: radial-gradient(circle at center, #0f1424 0%, #05070c 100%); 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            height: 100vh; 
        }

        /* 📈 ক্যানভাস ট্রেডিং গ্রাফ মেইন কন্টেইনার এরিয়া (ইনডেক্স ৫ এ লক ওস্তাদ) */
        .game-board-container {
            position: relative;
            z-index: 5;
            width: calc(100% - 24px);
            max-width: 450px;
            height: 250px;
            margin: 15px auto 5px auto;
            background: rgba(8, 12, 22, 0.85);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 14px;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        #crypto-graph-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 💸 বাজি ধরার প্রধান ২টি নিয়ন মার্কেট ট্রেন্ড বোতাম */
        .betting-board { display: flex; justify-content: space-between; padding: 5px 12px; gap: 12px; max-width: 450px; margin: 0 auto; width: calc(100% - 24px); position: relative; z-index: 10; }
        .bet-board-btn { flex: 1; border-radius: 14px; padding: 14px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .green-select-btn { background: linear-gradient(180deg, #0d3a1e 0%, #061a0d 100%); border: 2px solid #22c55e; }
        .green-select-btn .board-label { color: #4ade80; }
        
        .red-select-btn { background: linear-gradient(180deg, #3d1217 0%, #1a080a 100%); border: 2px solid #ef4444; }
        .red-select-btn .board-label { color: #f87171; }
        
        .board-label { font-size: 13px; font-weight: 900; letter-spacing: 0.3px; }
        .board-odds { font-size: 11px; font-weight: 700; color: #ffaa00; }
        
        /* 🎯 বাজি সিলেক্ট হলে কড়া কিংস গোল্ডেন নিয়ন হাইলাইট লক */
        .bet-board-btn.active-side-bet { border: 3px solid #ffaa00 !important; box-shadow: 0 0 15px #ffaa00 !important; background: linear-gradient(180deg, #2a2213 0%, #151008 100%) !important; transform: scale(1.02); }
        .bet-board-btn.active-side-bet .board-label { color: #ffaa00 !important; }

        /* 📢 লাইভ মেসেজ প্যানেল বার */
        .win-status-container { position: relative; z-index: 10; text-align: center; padding: 10px; margin: 5px 12px; background: rgba(9, 12, 18, 0.6); border-radius: 10px; border: 1px solid rgba(255,255,255,0.02); }
        #win-text-msg { font-size: 11px; font-weight: 700; color: #38bdf8; letter-spacing: 0.3px; }

        /* 🎛️ কন্ট্রোল ফুটার প্যানেল বার (TRADE বোতাম লক) */
        .footer-controls { position: relative; z-index: 50; background: #07090e; border-top: 1px solid #161b29; padding: 10px 15px 25px 15px; box-shadow: 0 -5px 20px rgba(0,0,0,0.6); }
        .play-section { display: flex; justify-content: space-between; align-items: center; gap: 10px; max-width: 450px; margin: 0 auto; }
        .bet-btn-nav { background: #111522; border: 1px solid #20293d; color: #ffaa00; font-size: 18px; font-weight: 800; width: 40px; height: 40px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .play-btn { flex: 1; background: linear-gradient(180deg, #ffbb00 0%, #d48800 100%); color: #000; font-size: 15px; font-weight: 900; border: none; padding: 11px 0; border-radius: 10px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 10px rgba(212,136,0,0.3); }
        .play-btn:disabled { background: #141721 !important; border-color: #1f2536 !important; color: #4b5563 !important; box-shadow: none !important; cursor: not-allowed; }
        .icon-btn { background: #111522; border: 1px solid #20293d; width: 40px; height: 40px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #ffaa00; font-weight: bold; }
        .icon-btn.active { background: #ffaa00; color: #000; box-shadow: 0 0 10px rgba(255,170,0,0.4); }

        .win-glow-bar { border-color: rgba(0, 255, 136, 0.4) !important; background: rgba(0, 255, 136, 0.05) !important; }
        .win-glow-bar #win-text-msg { color: #00ff88 !important; }
        .lose-glow-bar { border-color: rgba(255, 51, 102, 0.4) !important; background: rgba(255, 51, 102, 0.05) !important; }
        .lose-glow-bar #win-text-msg { color: #ff3366 !important; }
    </style>
</head>
<body>

    <div class="header" style="display:none !important;">
        <div class="balance-box">৳ <span id="user-balance">0.00</span></div>
    </div>

    <!-- 📈 ক্যানভাস ট্রেডিং গ্রাফ মেইন কন্টেইনার এরিয়া -->
    <div class="game-board-container">
        <canvas id="crypto-graph-canvas"></canvas>
    </div>

    <!-- 💸 বাজি ধরার প্রধান ২টি নিয়ন মার্কেট ট্রেন্ড বোতাম (GREEN UP, RED DOWN ওッズ লক) -->
    <div class="betting-board">
        <button class="bet-board-btn green-select-btn" id="board-GREEN" onclick="selectBetSide('GREEN')">
            <span class="board-label">GREEN (UP) ▲</span>
            <span class="board-odds">x1.95</span>
        </button>

        <button class="bet-board-btn red-select-btn" id="board-RED" onclick="selectBetSide('RED')">
            <span class="board-label">RED (DOWN) ▼</span>
            <span class="board-odds">x1.95</span>
        </button>
    </div>

    <!-- 📢 উইন-লস লাইভ ক্যাসিনো মেসেজ প্যানেল বার -->
    <div class="win-status-container" id="win-status-box">
        <span id="win-text-msg">মার্কেট ট্রেন্ড প্রেডিক্ট করে TRADE বোতাম চাপুন ভাই ভাই!</span>
    </div>

    <!-- 🎛️ অ্যাকশন কন্ট্রোল ফুটার প্যানেল বার -->
    <div class="footer-controls">
        <div class="play-section">
            <button class="bet-btn-nav" onclick="adjustBet('minus')">-</button>
            <div style="text-align: center; width: 60px;">
                <div style="font-size: 9px; color: #aaa; font-weight: bold;">BET</div>
                <div style="font-size: 15px; font-weight: 900; color: #fff;" id="bet-display">৳৫০</div>
            </div>
            <button class="bet-btn-nav" onclick="adjustBet('plus')">+</button>

            <button class="play-btn" id="spin-btn" onclick="handleCryptoTradeStart()">TRADE</button>
            
            <div class="icon-group">
                <button class="icon-btn" id="auto-btn" onclick="toggleAuto()">🤖</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('userId') || urlParams.get('id') || urlParams.get('username') || "guest_user";
        const urlWallet = urlParams.get('wallet') || "main";
        const SERVER_URL = window.location.origin;

        let balance = 0.00;
        let currentBet = 50;
        let selectedSide = null;
        let isSpinning = false;
        let isAuto = false;
        let isMuted = false;
        let autoInterval = null;

        // 📈 [HTML5 ক্যানভাস ডাইনামিক গ্রাফিক্যাল ইঞ্জিন লাইব্রেরি চ্যাম]
        let canvas, ctx;
        let graphPointsArray = [];
        let canvasAnimationTimerId = null;

        function initCryptoGraphCanvas() {
            canvas = document.getElementById("crypto-graph-canvas");
            if (!canvas) return;
            ctx = canvas.getContext("2d");
            
            // রেটিনা স্ক্রিন ক্লিয়ারিটি বাউন্সার লক
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            
            drawDefaultGraphBackgroundGrid();
        }

        function drawDefaultGraphBackgroundGrid() {
            if (!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // গ্রিড লাইন নিয়ন ছক আঁকা ভাই ভাই
            ctx.strokeStyle = "rgba(255, 255, 255, 0.03)";
            ctx.lineWidth = 1;
            let step = 25;
            
            for (let x = 0; x < canvas.width; x += step) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += step) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }
        }

                 // 🚀 [মেগা কিলার লাইভ ৩D গ্রাফ স্প্রিন্টার অ্যানিমেশন লুপ ওস্তাদ ভাই ভাই]
        function animateCryptoLiveTradingGraph(serverGameData) {
            let finalTrendResult = serverGameData.outcomeTrend || "GREEN"; 
            drawDefaultGraphBackgroundGrid();
            
            graphPointsArray = [{ x: 0, y: canvas.height / 2 }];
            let totalAnimationTicks = 0;
            let maxAnimationFrames = 30; 
            
            let singleStepX = canvas.width / maxAnimationFrames;
            let midHeightY = canvas.height / 2;

            if (canvasAnimationTimerId) clearInterval(canvasAnimationTimerId);

            canvasAnimationTimerId = setInterval(() => {
                totalAnimationTicks++;
                
                let lastPoint = graphPointsArray[graphPointsArray.length - 1];
                let currentNextX = totalAnimationTicks * singleStepX;
                
                // র্যান্ডম মার্কেট বাউন্স ওয়েভ জেনারেটর মেকানিজম লক
                let randomWaveLag = (Math.random() - 0.5) * 35;
                let currentNextY = lastPoint.y + randomWaveLag;

                // সীমানা লক যাতে গ্রাফ স্ক্রিনের বাইরে না ছিটকে যায় ভাই ভাই
                if (currentNextY < 20) currentNextY = 20;
                if (currentNextY > canvas.height - 20) currentNextY = canvas.height - 20;

                // শেষ ফাইনাল ফ্রেমে ওরিজিনাল সার্ভার ফলাфলের দিকে গ্রাফের মাথা কড়া মুভ লক!
                if (totalAnimationTicks >= maxAnimationFrames) {
                    clearInterval(canvasAnimationTimerId);
                    currentNextY = (finalTrendResult === "GREEN") ? midHeightY - 60 : midHeightY + 60;
                    graphPointsArray.push({ x: currentNextX, y: currentNextY });
                    
                    renderFullGraphStrokeChain(finalTrendResult);

                    setTimeout(() => {
                        if (serverGameData.balance !== undefined) {
                            balance = parseFloat(serverGameData.balance);
                        }
                        showFinalCryptoReward(serverGameData.status, serverGameData.winAmount, finalTrendResult);
                    }, 200);
                    return;
                }

                graphPointsArray.push({ x: currentNextX, y: currentNextY });
                renderFullGraphStrokeChain(finalTrendResult);
                playAudio('spin');

            }, 100);
        }

        function renderFullGraphStrokeChain(currentLiveTrend) {
            drawDefaultGraphBackgroundGrid();
            if (graphPointsArray.length < 2) return;

            ctx.beginPath();
            ctx.moveTo(graphPointsArray[0].x, graphPointsArray[0].y);
            
            for (let i = 1; i < graphPointsArray.length; i++) {
                ctx.lineTo(graphPointsArray[i].x, graphPointsArray[i].y);
            }

            // গ্রাফ লাইনের নিয়ন কালার টগল বর্ম (GREEN হলে সবুজ, RED হলে লাল সুতো!)
            ctx.strokeStyle = (currentLiveTrend === "GREEN") ? "#22c55e" : "#ef4444";
            ctx.lineWidth = 3;
            ctx.shadowBlur = 10;
            ctx.shadowColor = ctx.strokeStyle;
            ctx.stroke();
            ctx.shadowBlur = 0; // শ্যাডো বাফার রিসেট ভাই ভাই

            // গ্রাফের শেষ মাথায় ওরিজিনাল পালস ডট বিন্দু আঁকা ওস্তাদ
            let headNode = graphPointsArray[graphPointsArray.length - 1];
            ctx.beginPath();
            ctx.arc(headNode.x, headNode.y, 5, 0, 2 * Math.PI);
            ctx.fillStyle = "#ffffff";
            ctx.fill();
        }

        function adjustBet(action) {
            if (isSpinning) return;
            if (action === 'minus' && currentBet > 50) currentBet -= 50;
            if (action === 'plus' && currentBet < 20000) currentBet += 50;
            document.getElementById("bet-display").innerText = `৳${currentBet}`;
            playAudio('click');
        }

        function selectBetSide(side) {
            if (isSpinning) return;
            selectedSide = side; 
            document.getElementById("board-GREEN").classList.remove("active-side-bet");
            document.getElementById("board-RED").classList.remove("active-side-bet");
            document.getElementById(`board-${side}`).classList.add("active-side-bet");
            playAudio('click');
        }

        async function handleCryptoTradeStart() {
            if (isSpinning || isSpinning === true) return; 
            if (!selectedSide) {
                alert("🔒 বাজি প্লে করার আগে GREEN UP বা RED DOWN সিলেক্ট করুন ওস্তাদ!");
                return;
            }

            isSpinning = true;
            if (document.getElementById("spin-btn")) document.getElementById("spin-btn").disabled = true;
            if (document.getElementById("win-status-box")) document.getElementById("win-status-box").className = "win-status-container";
            if (document.getElementById("win-text-msg")) document.getElementById("win-text-msg").innerText = "🎰 লাইভ মার্কেট অ্যানালাইসিস করা হচ্ছে...";
            playAudio('click');

            try {
                const response = await fetch(`${SERVER_URL}/api/crypto-deal`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: urlUserId, amount: parseFloat(currentBet), wallet: urlWallet, prediction: selectedSide
                    })
                });

                const serverRes = await response.json();
                
                if (serverRes.success || serverRes.success === true) {
                    let parsedLiveBalance = serverRes.balance || serverRes.data?.balance || balance;
                    balance = parseFloat(parsedLiveBalance);
                    
                    let targetGamePayload = serverRes.gameData || serverRes;
                    animateCryptoLiveTradingGraph(targetGamePayload);
                } else {
                    alert(serverRes.message || "❌ Insufficient Balance! Please Recharge Wallet.");
                    stopCryptoState();
                }
            } catch (err) {
                stopCryptoState();
            }
        }

        function showFinalCryptoReward(status, winAmount, finalTrend) {
            const msgBox = document.getElementById("win-status-box");
            const textMsg = document.getElementById("win-text-msg");
            
            let displayTrendBengali = finalTrend === "GREEN" ? "GREEN UP (📈 বুলিশ মার্কেট)" : "RED DOWN (📉 বেয়ারিশ মার্কেট)";

            if (status === "win") {
                playAudio('win');
                if (msgBox) msgBox.className = "win-status-container win-glow-bar";
                if (textMsg) textMsg.innerHTML = `🎉 গ্র্যান্ড উইন ওস্তাদ! মার্কেট ট্রেন্ড ছিল <b>${displayTrendBengali}</b> এবং ওয়ালেটে ৳${winAmount} ক্রেডিট হয়েছে ভাই ভাই!`;
            } else {
                playAudio('wheel');
                if (msgBox) msgBox.className = "win-status-container lose-glow-bar";
                if (textMsg) textMsg.innerHTML = `💥 ওহ হো লস! মার্কেট ট্রেন্ড ছিল <b>${displayTrendBengali}</b>। আবার অন ফায়ার কদম ফেলুন ওস্তাদ ভাই ভাই!`;
            }

            if (typeof balance !== 'undefined' && !isNaN(balance)) {
                if (document.getElementById("user-balance")) {
                    document.getElementById("user-balance").innerText = balance.toFixed(2);
                }
            }

            setTimeout(() => { fetchLiveBalance(); }, 1500);
            stopCryptoState();

            if (isAuto) {
                autoInterval = setTimeout(() => {
                    if (isAuto) handleCryptoTradeStart();
                }, 3500);
            }
        }

        if (typeof io !== 'undefined') {
            const socket = io();
            socket.on("balanceUpdate", (data) => {
                if (data && data.username === urlUserId) {
                    if (data.balance !== undefined) {
                        balance = parseFloat(data.balance);
                        if (document.getElementById("user-balance")) {
                            document.getElementById("user-balance").innerText = balance.toFixed(2);
                        }
                    }
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                }
            });
        }

        async function fetchLiveBalance() {
            try {
                const response = await fetch(`${SERVER_URL}/api/crypto-balance?userId=${urlUserId}&wallet=${urlWallet}`);
                const serverData = await response.json();
                if (serverData.success || serverData.balance !== undefined) {
                    balance = parseFloat(serverData.balance);
                    if (document.getElementById("user-balance")) {
                        document.getElementById("user-balance").innerText = balance.toFixed(2);
                    }
                }
            } catch (e) { console.error("Balance stream link check"); }
        }

        window.onload = () => {
            if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
            initCryptoGraphCanvas(); // ক্যানভাস ইঞ্জিন चालू ভাই ভাই
            fetchLiveBalance();
        };

        function toggleAuto() {
            isAuto = !isAuto;
            const autoEl = document.getElementById("auto-btn");
            if (autoEl) autoEl.classList.toggle('active', isAuto);
            if (isAuto && !isSpinning) handleCryptoTradeStart();
            playAudio('click');
        }

                function stopCryptoState() {
            isSpinning = false;
            if (document.getElementById("spin-btn")) {
                document.getElementById("spin-btn").disabled = false;
            }
            if (!isAuto && autoInterval) clearTimeout(autoInterval);
        }

        const slotSounds = {
            click: new Audio('spin2.mp3'),
            spin: new Audio('spin2.mp3'),
            win: new Audio('win2.mp3'),
            wheel: new Audio('spin2.mp3')
        };
        Object.values(slotSounds).forEach(s => s.load());

        function playAudio(type) {
            try { slotSounds[type].currentTime = 0; slotSounds[type].play(); } catch(e) {}
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRYPTO MULTIPLY CASINO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🎰 ক্যাসিনো হেডার প্যানেল -->
    <div class="header">
        <div class="brand">
            <div class="name">CRYPTO MULTIPLY</div>
            <div class="game">FAST TRADING GRAPH</div>
        </div>
        <div class="header-right">
            <button class="sound-btn" id="mute-btn" onclick="toggleMute()">🔊</button>
            <div class="balance-box">৳ <span id="user-balance">0.00</span></div>
        </div>
    </div>

    <!-- 📊 [লাইভ ক্রিপ্টো নিয়ন চার্ট ও গোল্ডেন কয়েন জোন] -->
    <div class="crypto-chart-outer">
        <div class="crypto-logo-hud">₿</div>
        <canvas id="crypto-canvas" width="360" height="240"></canvas>
    </div>

    <!-- 🎰 বাজি ধরার প্রধান ২টি নিয়ন রঙের ক্যাসিনো ঘর প্যানেল ভাই ভাই -->
    <div class="betting-board">
        <button class="bet-board-btn green-bet" id="board-green" onclick="selectBetSide('GREEN')">
            <span class="board-label">GREEN (UP) 🔺</span>
            <span class="board-odds">x2.00</span>
        </button>
        
        <button class="bet-board-btn red-bet" id="board-red" onclick="selectBetSide('RED')">
            <span class="board-label">RED (DOWN) 🔻</span>
            <span class="board-odds">x2.00</span>
        </button>
    </div>

    <!-- 🏆 ইন-লাইন লাইভ স্কোরিং মেসেজ বার -->
    <div class="win-status-container" id="win-status-box">
        <span id="win-text-msg">GREEN বা RED চুজ করে TRADE বোতাম চাপুন ভাই!</span>
    </div>

    <!-- 🎛️ কন্ট্রোল প্যানেল এরিয়া (৳১-৳২০০০ প্লাস-মাইনাস ও TRADE বোতাম পাশাপাশি লক ভাই) -->
    <div class="footer-controls">
        <div class="play-section">
            <div class="bet-selector">
                <button class="bet-btn-nav" onclick="adjustBet('minus')">−</button>
                <div style="text-align: center; width: 60px;">
                    <div style="font-size: 9px; color: #aaa; font-weight: bold;">BET</div>
                    <div style="font-size: 15px; font-weight: 900; color: #fff;" id="bet-display">৳৫০</div>
                </div>
                <button class="bet-btn-nav" onclick="adjustBet('plus')">+</button>
            </div>

            <button class="play-btn" id="spin-btn" onclick="handleCryptoTrade()">TRADE</button>

            <div class="icon-group">
                <button class="icon-btn" id="auto-btn" onclick="toggleAuto()">🔄</button>
            </div>
        </div>
    </div>

    <!-- 🔌 [উইনগো কালার ট্রেড সিঙ্ক - ইউনিভার্সাল সকেট ইঞ্জিন লাইব্রেরি ভাই] -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('userId') || urlParams.get('id') || urlParams.get('username') || "guest_user";
        const urlWallet = urlParams.get('wallet') || "main";
        
        const SERVER_URL = window.location.origin;

        const canvas = document.getElementById("crypto-canvas");
        const ctx = canvas.getContext("2d");

        let balance = 0.00;
        let currentBet = 50; 
        let selectedOption = null; // GREEN, RED
        let isSpinning = false; 
        let isAuto = false;
        let isMuted = false;
        let autoInterval = null;

        // চার্ট গ্রাফ হিস্টোরি ব্যাকআপ ট্র্যাকার ভাই ভাই
        let graphPoints = [120, 130, 110, 140, 125, 135, 115, 120];

        function drawTradingGraph(liveY = null) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // গ্রাফের ভেতরের ব্যাকগ্রাউন্ড নিওন গ্রিড লাইন ভাই ভাই
            ctx.strokeStyle = "rgba(255, 255, 255, 0.03)";
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 30) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for (let j = 0; j < canvas.height; j += 30) {
                ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
            }

            // ওরিজিনাল ক্রিপ্টো ক্যান্ডেল ট্রেড লাইন ড্রয়িং ভাই ভাই
            ctx.strokeStyle = "#f1c40f";
            ctx.lineWidth = 3;
            ctx.lineJoin = "round";
            ctx.beginPath();

            const spacing = canvas.width / (graphPoints.length);
            ctx.moveTo(0, graphPoints[0]);

            for (let i = 1; i < graphPoints.length; i++) {
                ctx.lineTo(i * spacing, graphPoints[i]);
            }

            if (liveY !== null) {
                ctx.lineTo(canvas.width, liveY);
            }
            ctx.stroke();

            // শেষ মাথার লাইভ ট্রেড পালস ডট
            const lastY = (liveY !== null) ? liveY : graphPoints[graphPoints.length - 1];
            ctx.fillStyle = (liveY !== null && isSpinning) ? "#00ffcc" : "#f1c40f";
            ctx.beginPath();
            ctx.arc(canvas.width, lastY, 6, 0, Math.PI * 2);
            ctx.fill();
        }

        if (typeof io !== 'undefined') {
            const socket = io();
            socket.on("balanceUpdate", (data) => {
                if (data && data.username === urlUserId) {
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    fetchLiveBalance();
                }
            });
        }

        async function fetchLiveBalance() {
            try {
                const response = await fetch(`${SERVER_URL}/api/crypto-balance?userId=${urlUserId}&wallet=${urlWallet}`);
                const data = await response.json();
                if (data && data.success) {
                    balance = parseFloat(data.balance);
                    document.getElementById("user-balance").innerText = balance.toFixed(2);
                }
            } catch (e) { console.error("Balance lag"); }
        }

        window.onload = () => {
            if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
            fetchLiveBalance();
            drawTradingGraph();
        };

        function selectBetSide(side) {
            if (isSpinning) return;
            selectedOption = side;
            
            document.querySelectorAll(".bet-board-btn").forEach(b => b.classList.remove("active-side-bet"));
            if (side === 'GREEN') document.getElementById("board-green").classList.add("active-side-bet");
            if (side === 'RED') document.getElementById("board-red").classList.add("active-side-bet");
            
            playAudio('click');
        }

        function adjustBet(action) {
            if (isSpinning) return;
            if (action === 'minus' && currentBet > 1) {
                if (currentBet <= 10) currentBet -= 1;
                else if (currentBet <= 100) currentBet -= 10;
                else currentBet -= 50;
            }
            if (action === 'plus' && currentBet < 2000) {
                if (currentBet < 10) currentBet += 1;
                else if (currentBet < 100) currentBet += 10;
                else currentBet += 50;
            }
            if (currentBet < 1) currentBet = 1;
            if (currentBet > 2000) currentBet = 2000;
            
            document.getElementById("bet-display").innerText = `৳${currentBet}`;
            playAudio('click');
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById("mute-btn").innerText = isMuted ? "🔇" : "🔊";
            document.getElementById("mute-btn").classList.toggle("muted-active", isMuted);
        }

                function toggleAuto() {
            isAuto = !isAuto;
            document.getElementById("auto-btn").classList.toggle("active", isAuto);
            if (isAuto && !isSpinning) handleCryptoTrade();
            playAudio('click');
        }

        async function handleCryptoTrade() {
            if (isSpinning) return;
            if (!selectedOption) {
                alert("🚨 আগে বাজি ধরার যেকোনো ১টি মোশন (GREEN বা RED) সিলেক্ট করুন ভাই!");
                isAuto = false;
                document.getElementById("auto-btn").classList.remove("active");
                return;
            }

            const msgBox = document.getElementById("win-status-box");
            msgBox.className = "win-status-container";
            document.getElementById("win-text-msg").innerText = "📈 ক্রিপ্টো মার্কেট লাইভ অ্যানালাইসিস হচ্ছে...";

            isSpinning = true;
            document.getElementById("spin-btn").disabled = true;

            playAudio('click');
            playAudio('spin'); // 🚀 ট্রেড চলার সাথে সাথে spin2.mp3 ক্যান্ডেল গড়গড় সাউন্ড ফায়ার লক ভাই!

            // ফ্রন্টএন্ডে লাইভ চার্ট বাউন্সিং মোশন এনিমেশন চালু ভাই ভাই
            let frameCount = 0;
            const lastFixedY = graphPoints[graphPoints.length - 1];
            
            const graphInterval = setInterval(() => {
                // চার্টের শেষ মাথায় লাইভ নিওন পালস লাফালাফি করবে ভাই ভাই
                let liveBounceY = lastFixedY + (Math.sin(frameCount * 0.5) * 15) + (Math.random() * 6 - 3);
                drawTradingGraph(liveBounceY);
                frameCount++;
            }, 40);

            try {
                const response = await fetch(`${SERVER_URL}/api/crypto-trade`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: urlUserId,
                        amount: parseFloat(currentBet),
                        wallet: urlWallet,
                        prediction: selectedOption
                    })
                });

                const data = await response.json();

                if (data && data.success === true) {
                    balance = parseFloat(data.balance);
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    if (window.top) window.top.postMessage({ action: "refresh_wallet" }, "*");

                    // ৩ সেকেন্ডের হার্টবিট ট্রেডিং থ্রিল শেষে চার্ট একদম ওরিজিনাল টার্গেট পয়েন্টে গিয়ে ব্রেক চাপবে ভাই
                    setTimeout(() => {
                        clearInterval(graphInterval);
                        
                        // ওল্ড চার্ট মেমোরি সাফ করে নতুন ৩টি পয়েন্ট পুশ ট্রিকস ভাই ভাই
                        graphPoints.shift();
                        graphPoints.push(data.finalGraphY);

                        drawTradingGraph();
                        showFinalResult(data.status, data.winAmount, data.directionName);
                    }, 3000);

                } else {
                    clearInterval(graphInterval);
                    alert(data.message || "❌ Insufficient Balance! Please Recharge.");
                    stopTradeState();
                }
            } catch (err) {
                clearInterval(graphInterval);
                alert("⚠️ সেশন আউট! আবার TRADE বোতাম চাপুন ভাই ভাই।");
                stopTradeState();
            }
        }

        function showFinalResult(status, winAmount, directionName) {
            const msgBox = document.getElementById("win-status-box");
            const textMsg = document.getElementById("win-text-msg");

            if (status === "win") {
                // 🎵 বাজি জিতে টাকা ২ গুণ ডবল হওয়ামাত্রই win2.mp3 রাজকীয় সাউন্ড ফায়ার লক ভাই!
                playAudio('win');
                msgBox.className = "win-status-container win-glow-bar";
                textMsg.innerText = `🏆 মেগা উইন!! মার্কেট ট্রেন্ড গেছে: ${directionName} (৳${winAmount})`;
            } else {
                msgBox.className = "win-status-container lose-glow-bar";
                textMsg.innerText = `❌ মার্কেট ট্রেন্ড গেছে: ${directionName}। এই রাউন্ডে বাজি লস হয়েছে ভাই!`;
            }

            document.getElementById("user-balance").innerText = balance.toFixed(2);
            stopTradeState();

            if (isAuto) {
                autoInterval = setTimeout(() => {
                    if (isAuto) handleCryptoTrade();
                }, 2000);
            }
        }

        function stopTradeState() {
            isSpinning = false;
            document.getElementById("spin-btn").disabled = false;
            if (!isAuto && autoInterval) clearTimeout(autoInterval);
        }

        // 🎯 [আপনার রিকোয়ারমেন্ট অনুযায়ী ৩টি প্রিমিয়াম সাউন্ড ও বাফার গেটওয়ে লক ভাই ভাই]
        const slotSounds = {
            click: new Audio('click2.mp3'),
            spin: new Audio('spin2.mp3'),
            win: new Audio('win2.mp3')
        };
        Object.values(slotSounds).forEach(s => s.load());

        function playAudio(type) { 
            if (isMuted) return; // 🔇 সাউন্ড অফ থাকলে কোনো অডিও প্লে হবে না ভাই ভাই!
            try { 
                slotSounds[type].currentTime = 0; 
                slotSounds[type].play(); 
            } catch(e){} 
        }
    </script>
</body>
</html>
